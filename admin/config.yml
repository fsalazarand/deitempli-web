backend:
  name: github
  repo: fsalazarand/deitempli-web
  branch: main

media_folder: "images"
public_folder: "/images"

locale: es

collections:
  - name: "fotos"
    label: "📸 Fotos del Hotel"
    files:
      - name: "fotos"
        label: "Gestionar todas las fotos"
        file: "data/fotos.json"
        fields:
          - label: "🌅 Foto principal — inicio de la página"
            name: hero
            widget: image
            required: false
            hint: "Foto HORIZONTAL con el mar. Ocupa toda la pantalla de inicio."

          - label: "🛏️ Habitación Deluxe"
            name: hab_deluxe
            widget: image
            required: false
            hint: "Foto principal de la Deluxe."

          - label: "🛏️ Habitación Estándar con balcón"
            name: hab_estandar
            widget: image
            required: false

          - label: "🏠 Departamentos Doble y Triple"
            name: hab_depto
            widget: image
            required: false

          - label: "🍹 La estadía — Dei Bar en el balcón (foto grande)"
            name: bar_coctel
            widget: image
            required: false
            hint: "Foto horizontal: cócteles o tabla con el mar de fondo."

          - label: "🥐 La estadía — Desayuno (foto chica)"
            name: bar_desayuno
            widget: image
            required: false

          - label: "⛵ Departamento Carabela"
            name: carabela
            widget: image
            required: false

          - label: "📷 Galería 1 (foto grande)"
            name: galeria_1
            widget: image
            required: false

          - label: "📷 Galería 2"
            name: galeria_2
            widget: image
            required: false

          - label: "📷 Galería 3"
            name: galeria_3
            widget: image
            required: false

          - label: "📷 Galería 4"
            name: galeria_4
            widget: image
            required: false

          - label: "📷 Galería 5"
            name: galeria_5
            widget: image
            required: false

  - name: "contenido"
    label: "✏️ Textos del Hotel"

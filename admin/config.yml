backend:
  name: github
  repo: fsalazarand/deitempli-web
  branch: main

media_folder: "images"
public_folder: "/images"

locale: es

collections:
  - name: "fotos"
    label: "📸 Fotos del Hotel"
    files:
      - name: "fotos"
        label: "Gestionar todas las fotos"
        file: "data/fotos.json"
        fields:
          - label: "🌅 Foto principal — Hero (balcón al amanecer, vista frontal Pacífico)"
            name: hero
            widget: image
            required: false
            hint: "Foto horizontal. Ocupa toda la pantalla de inicio."

          - label: "🏨 Sobre nosotros — Foto grande (vista o fachada del hotel)"
            name: about_big
            widget: image
            required: false
            hint: "Foto grande de la sección 'Sobre nosotros'. Ideal: vista aérea o fachada."

          - label: "🍳 Sobre nosotros — Foto pequeña (desayuno en balcón)"
            name: about_small
            widget: image
            required: false
            hint: "Foto pequeña debajo de la anterior. Ideal: desayuno o detalle del hotel."

          - label: "🛏️ Habitación Deluxe (ventanal panorámico con vista al mar)"
            name: hab_deluxe
            widget: image
            required: false
            hint: "Foto principal de la Habitación Deluxe."

          - label: "🛏️ Habitación Estándar (balcón con vista al mar)"
            name: hab_estandar
            widget: image
            required: false
            hint: "Foto de la Habitación Estándar."

          - label: "🏠 Departamento (kitchenette + balcón)"
            name: hab_depto
            widget: image
            required: false
            hint: "Foto del Departamento familiar."

          - label: "⛵ Departamento Carabela (balcón panorámico, Playa El Encanto)"
            name: carabela
            widget: image
            required: false
            hint: "Foto del Departamento Carabela. Ideal con vista a la playa."

          - label: "🍹 Dei Bar — Cócteles en balcón al atardecer"
            name: bar_coctel
            widget: image
            required: false
            hint: "Foto del Dei Bar. Ideal: bebidas con el Pacífico de fondo."

          - label: "🥐 Dei Bar — Desayuno completo en bandeja"
            name: bar_desayuno
            widget: image
            required: false
            hint: "Foto del desayuno servido en balcón o bandeja."

          - label: "📷 Galería 1 — Vista panorámica desde balcón Deluxe"
            name: galeria_1
            widget: image
            required: false

          - label: "📷 Galería 2 — Piscina exterior con el mar de fondo"
            name: galeria_2
            widget: image
            required: false

          - label: "📷 Galería 3 — Pareja en balcón con cócteles, atardecer"
            name: galeria_3
            widget: image
            required: false

          - label: "📷 Galería 4 — Desayuno en bandeja sobre la cama"
            name: galeria_4
            widget: image
            required: false

          - label: "📷 Galería 5 — Carabela, vista a Playa El Encanto"
            name: galeria_5
            widget: image
            required: false

          - label: "📷 Galería 6 — Pizza casera Dei Bar, balcón de noche"
            name: galeria_6
            widget: image
            required: false

  - name: "contenido"
    label: "✏️ Textos del Hotel"
    files:

      # ─── DATOS DE CONTACTO ───────────────────────────────────
      - name: "general"
        label: "📞 Contacto y datos generales"
        file: "data/contenido.json"
        fields:
          - label: "Teléfono WhatsApp (sin espacios)"
            name: telefono
            widget: string
            hint: "Ej: +56966130676"

          - label: "Teléfono (cómo se muestra en la web)"
            name: telefono_display
            widget: string
            hint: "Ej: +56 9 6613 0676"

          - label: "Email de contacto"
            name: email
            widget: string

          - label: "Código de descuento"
            name: codigo_descuento
            widget: string

          - label: "Porcentaje de descuento"
            name: pct_descuento
            widget: string
            hint: "Ej: 10%"

          - label: "Horario desayuno"
            name: horario_desayuno
            widget: string
            hint: "Ej: 8:00 a 11:30"

          - label: "Check-in hora"
            name: checkin_hora
            widget: string
            hint: "Ej: 16:00"

          - label: "Check-out hora"
            name: checkout_hora
            widget: string
            hint: "Ej: 12:00"

          - label: "─────────── 🌊 HERO (inicio de página) ───────────"
            name: _sep_hero
            widget: hidden

          - label: "Hero — Etiqueta superior (ej: REÑACA · VIÑA DEL MAR)"
            name: hero_tag
            widget: string

          - label: "Hero — Título principal"
            name: hero_h1
            widget: text
            hint: "Usa <br> para salto de línea. Usa <em>palabra</em> para texto dorado en cursiva."

          - label: "Hero — Subtítulo / descripción"
            name: hero_sub
            widget: text

          - label: "Hero — Texto de reseñas (ej: 4.6 en Google · 532 reseñas)"
            name: hero_proof
            widget: string
            hint: "Usa <strong>texto</strong> para negrita."

          - label: "Barra de promoción (bajo el buscador de fechas)"
            name: promo_strip
            widget: string
            hint: "Usa <strong>texto</strong> para negrita."

          - label: "─────────── 🏨 SOBRE NOSOTROS ───────────"
            name: _sep_about
